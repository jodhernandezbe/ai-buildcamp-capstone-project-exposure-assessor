# External-service settings. Change URLs/endpoints here, not in code.

[comptox]
base_url = "https://comptox.epa.gov/ctx-api"
# {casrn} is replaced with the hyphenated CAS number. The response is a list whose matching
# entry has "searchName" = "CAS-RN" and carries "dtxsid", "casrn" and "smiles".
dtxsid_by_cas_path = "/chemical/search/equal/{casrn}"
# {dtxsid} is replaced with the DTXSID; the response is an object with "averageMass" (g/mol).
detail_by_dtxsid_path = "/chemical/detail/search/by-dtxsid/{dtxsid}"
# {dtxsid} is replaced with the DTXSID; the response is a list of property summaries.
properties_by_dtxsid_path = "/chemical/property/summary/search/by-dtxsid/{dtxsid}"
# {dtxsid} is replaced with the DTXSID; the response is a list of ToxVal records.
toxval_by_dtxsid_path = "/hazard/toxval/search/by-dtxsid/{dtxsid}"
# When several ToxVal records match a toxicity value, prefer these `source` names in order;
# sources not listed rank after all listed ones.
source_priority = ["IRIS"]
# Header carrying the API key, and the environment variable (e.g. in .env) that holds it.
api_key_header = "x-api-key"  # pragma: allowlist secret
api_key_env_var = "COMPTOX_API_KEY"  # pragma: allowlist secret
# Seconds to wait before each request.
delay_seconds = 0.2
timeout_seconds = 15.0
# Skip only the validity-dates check of the service's TLS certificate (chain and host name are
# still verified). For an outage where EPA's certificate has lapsed (2026-10-21); set it back
# to false once the certificate is renewed.
accept_expired_certificate = false

# Molecular weight comes from the chemical detail response (detail_by_dtxsid_path). `field` is
# the response field holding it; `unit` is the unit the API reports it in (the response carries
# no unit); `target_unit` is the unit the tool returns.
[comptox.molecular_weight]
field = "averageMass"
unit = "g/mol"
target_unit = "g/mol"

# Properties to extract. `name` is CompTox's propName; `key` is the key in the result;
# `target_unit` is the unit the tool returns (values are converted to it with Pint).
# Add another [[comptox.properties]] table to extract more properties.
[[comptox.properties]]
key = "vapor_pressure"
name = "Vapor Pressure"
target_unit = "mmHg"

[[comptox.properties]]
key = "density"
name = "Density"
target_unit = "g/cm^3"

# Toxicity values to extract from ToxVal records. A record is used when its `toxvalType` equals
# one of `types` (exact match) and its `exposureRoute` is one of `routes` (case-insensitive).
# Among records of the best-ranked source, `prefer` picks the "lowest" or "highest" value (the
# most conservative one). `key` is the key in the result; `target_unit` as for properties.
# The first route is the one the value applies to and is reported as such; "not specified" is
# accepted only for RfD and RfC, whose names already imply the route.
# Add another [[comptox.toxicity_values]] table to extract more values.
[[comptox.toxicity_values]]
key = "rfd"
types = ["RfD"]
routes = ["oral", "not specified"]
prefer = "lowest"
target_unit = "mg/(kg*day)"

[[comptox.toxicity_values]]
key = "rfc"
types = ["RfC"]
routes = ["inhalation", "not specified"]
prefer = "lowest"
target_unit = "mg/m^3"

[[comptox.toxicity_values]]
key = "sf"
types = ["cancer slope factor"]
routes = ["oral"]
prefer = "highest"
target_unit = "1/(mg/(kg*day))"

[[comptox.toxicity_values]]
key = "iur"
types = ["cancer unit risk"]
routes = ["inhalation"]
prefer = "highest"
target_unit = "1/(ug/m^3)"

# EPA Envirofacts (efservice): one place for the service root and how politely it is called.
# Every query (TRI, FRS) goes through it. Seconds to wait before each request, per-request
# timeout, and retries on HTTP 429/5xx or timeouts with a wait of backoff_seconds doubling
# each time (Retry-After is honoured).
[efservice]
base_url = "https://data.epa.gov/efservice"
delay_seconds = 1.0
timeout_seconds = 60.0
max_retries = 2
backoff_seconds = 5.0

# FRS ID -> EIS facility ID (the NEI's own facility key). {frs_id} is the 12-digit FRS ID; the
# response lists the facility's registrations in the EIS program, whose `pgm_sys_id` is the EIS ID.
[frs]
eis_path = "/FRS_PROGRAM_FACILITY/REGISTRY_ID/{frs_id}/PGM_SYS_ACRNM/EIS/JSON"
program = "EIS"
registry_field = "registry_id"
program_field = "pgm_sys_acrnm"
eis_id_field = "pgm_sys_id"

# Facility coordinates from the EPA FRS "best pick" lookup (data.epa.gov dmapservice, a separate
# service from efservice), used when TRI has none (TRI stopped collecting them for most
# facilities). One request answers many facilities: {frs_ids} is a comma-separated list of
# 12-digit FRS IDs, `registry_field` names the ID in each answer row and the coordinates are in
# decimal degrees (WGS84, west negative). Lists of 200 IDs were answered and 400 were refused
# (HTTP 400), so `batch_size` stays well below that.
[frs_point]
base_url = "https://data.epa.gov/dmapservice"
path = "/lookups.mv_new_geo_best_picks/registry_id/in/{frs_ids}"
registry_field = "registry_id"
latitude_field = "latitude"
longitude_field = "longitude"
batch_size = 100

# EIS (NEI) facility IDs of the listed facilities, many per request, from the same service
# (Envirofacts `efservice` has no list operator, so it would be one request per facility).
# `eis_path` lists the EIS program registrations of {frs_ids}. FRS sometimes holds one site under
# several FRS IDs and TRI's is not always the one registered in EIS, so a facility without a
# registration is matched to another FRS record of exactly the same site name (`sites_path` gives
# the facility's own FRS name and location, `twins_path` the records of that name in that state)
# within `max_twin_distance_km`, and only when exactly one such record has EIS registrations.
[frs_eis]
base_url = "https://data.epa.gov/dmapservice"
eis_path = "/frs.frs_program_facility/registry_id/in/{frs_ids}/pgm_sys_acrnm/equals/EIS"
registry_field = "registry_id"
eis_id_field = "pgm_sys_id"
sites_path = "/lookups.mv_new_geo_best_picks/registry_id/in/{frs_ids}"
twins_path = "/lookups.mv_new_geo_best_picks/primary_name/equals/{name}/state_code/equals/{state}"
name_field = "primary_name"
state_field = "state_code"
latitude_field = "latitude"
longitude_field = "longitude"
batch_size = 100
max_twin_distance_km = 0.5
# Same-site searches run this many at a time (each is one request); EIS IDs found are reused
# for cache_seconds (registrations change rarely).
twin_workers = 4
cache_seconds = 86400

# EPA Envirofacts TRI release data. The path joins the reporting form, chemical, facility,
# release and submission-NAICS tables (so every row carries its NAICS code) and filters on CAS number and environmental medium (the medium segment has
# no "/equals/": that form returns nothing). {casrn} is the hyphenated CAS number, {medium} the
# URL-encoded medium, {after_year} the year after which reports are wanted and {start}:{end} an inclusive row range, so a page of N rows is
# start .. start+N-1. Rows are not ordered by year and the end of data is signalled by a page
# shorter than page_size (probing past the end hangs), so the whole result is read.
# A submission with secondary NAICS codes comes back once per code; only its primary row
# (`naics_primary` = 1) is kept, so its release is never counted twice. Filtering on the primary
# indicator in the URL instead gives the same rows but was about 3 times slower.
[tri]
release_path = "/tri_reporting_form/tri_chem_info/tri_facility/tri_release_qty/tri_submission_naics/cas_registry_number/{casrn}/environmental_medium/{medium}/reporting_year/>/{after_year}/rows/{start}:{end}/JSON"
# Media to keep; one query per medium. Add e.g. "AIR FUGITIVE" here to return it as well.
media = ["AIR STACK"]
# A request is ~11 s for 1000 rows (~5 MB); per-request overhead dominates, so pages are large.
page_size = 1000
max_pages = 40
# Only the most recent reporting years count: a facility whose latest report is older has probably
# stopped (a 1988 record would be assessed as if it were current). The window is the last
# `recent_years` reporting years ending with the newest one that can be published, so the URL asks
# for `reporting_year > current year - publication_lag_years - recent_years` and rows outside the
# window are dropped again on arrival. TRI for year N is released annually by June of N + 1 (2025
# data in 2026), so the newest year that can exist is the current year minus the lag; two years
# keep a facility that has not filed the newest year yet.
recent_years = 2
publication_lag_years = 1
# The inventory tool lists at most this many facilities to the model, the largest emission rates
# first (a widely reported chemical has over a thousand, far too many for the model to rank by
# eye); the complete result goes to the interface, and the model is told how many were left out.
max_listed = 25
# TRI sends longitudes as positive numbers for the western hemisphere; these states and
# territories lie east of Greenwich, so their longitudes stay positive.
east_longitude_states = ["GU", "MP"]
# FRS ID: first of these columns that is set. epa_registry_id is the FRS ID; frs_id is
# empty in the rows seen so far.
facility_id_fields = ["epa_registry_id", "frs_id"]

# Result key -> TRI column.
[tri.fields]
medium = "environmental_medium"
year = "reporting_year"
# Control number of the submission (form); it identifies the reported record, e.g. for its NAICS.
doc_ctrl_num = "doc_ctrl_num"
quantity = "total_release"
unit = "unit_of_measure"
facility_name = "facility_name"
latitude = "pref_latitude"
longitude = "pref_longitude"
address = "street_address"
city = "city_name"
county = "county_name"
state = "state_abbr"
zip_code = "zip_code"
# Primary NAICS code of the submission, and the indicator that marks the primary code's row.
naics_code = "naics_code"
naics_primary = "primary_ind"

# Operating hours per year used to turn an annual release into an average rate. 8760 is
# continuous operation (24 h x 365 d), a conservative screening assumption.
[emissions]
operating_hours_per_year = 8760

# Stack parameters. Quantities are always the four keys stack_height, stack_diameter,
# exit_velocity and exit_temperature.
#
# Tier 2: EPA PSTK (Point Source Stack Replacements), SCC-keyed default stacks, read from a
# local CSV. Only national rows are used: an empty FIPS cell or one of `national_fips` (the
# tool has no location input, so county-specific rows are ignored). Delete `fips_column` if
# the file has none; every row then counts as national.
[stack.pstk]
path = "data/pstk.csv"
scc_column = "scc"
fips_column = "fips"
national_fips = ["0", "00000"]

# Quantity -> PSTK column.
[stack.pstk.columns]
stack_height = "stkhgt"
stack_diameter = "stkdiam"
exit_velocity = "stkvel"
exit_temperature = "stktemp"

# Quantity -> unit the PSTK file reports it in (SMOKE PSTK files are metric). Converted with
# Pint, so e.g. "ft", "ft/s" or "degF" also work.
[stack.pstk.units]
stack_height = "m"
stack_diameter = "m"
exit_velocity = "m/s"
exit_temperature = "K"

# Tier 1: EPA NEI stack values, a compact table of one row per distinct (EIS facility ID, four
# stack values) split into gzip CSV shards named by the leading `prefix_digits` digits of the EIS
# ID, so a lookup reads one small file. Build it from the raw SMOKE point flat file (a zip, kept in
# data/raw/, not committed) with: uv run python -m scripts.compact_nei_stacks
# A facility can have many stacks: at most `max_candidates` distinct combinations are returned,
# lowest stack first, after merging combinations equal to `merge_significant_digits` digits.
[stack.nei]
directory = "data/nei_stacks"
file_template = "nei_stacks_{prefix}.csv.gz"
prefix_digits = 1
id_column = "eis_id"
max_candidates = 10
merge_significant_digits = 2
raw_path = "data/raw/nei_smoke_point_2023.zip"
raw_id_column = "FACILITY_ID"

# Quantity -> shard column.
[stack.nei.columns]
stack_height = "stkhgt"
stack_diameter = "stkdiam"
exit_velocity = "stkvel"
exit_temperature = "stktemp"

# Quantity -> unit the table reports it in. The SMOKE FF10 point format is imperial.
[stack.nei.units]
stack_height = "ft"
stack_diameter = "ft"
exit_velocity = "ft/s"
exit_temperature = "degF"

# Quantity -> column of the raw SMOKE flat file.
[stack.nei.raw_columns]
stack_height = "STKHGT"
stack_diameter = "STKDIAM"
exit_velocity = "STKVEL"
exit_temperature = "STKTEMP"

# Units the stack tools return.
[stack.target_units]
stack_height = "m"
stack_diameter = "m"
exit_velocity = "m/s"
exit_temperature = "K"

# Plausible [minimum, maximum] per quantity, in the target units. A value outside its range
# is treated as missing (fail closed), never clipped.
[stack.ranges]
stack_height = [0.1, 450.0]
stack_diameter = [0.01, 30.0]
exit_velocity = [0.01, 150.0]
exit_temperature = [200.0, 1800.0]

# Final fallback when the SCC lookup fails: the global point-source default from the EPA
# AirToxScreen Technical Support Document (3.0 m = 9.84 ft, 0.2 m = 0.66 ft,
# 4.0 m/s = 13.12 ft/s, 295.4 K = 72.05 degF).
[stack.global_fallback]
stack_height = 3.0
stack_diameter = 0.2
exit_velocity = 4.0
exit_temperature = 295.4

# Embedding model used by the SCC retrieval (tools/emissions/rag/). `provider` selects the
# implementation in tools/emissions/rag/embeddings.py; the API key is read from the
# environment variable named here.
[embeddings]
provider = "openai"
model = "text-embedding-3-small"
api_key_env_var = "OPENAI_API_KEY"  # pragma: allowlist secret
timeout_seconds = 30.0

# SCC process-context retrieval: a persistent vector index of the EPA SCC table, queried
# with a NAICS (industry) description. The index is rebuilt automatically when the table,
# the filters, the column mapping or the embedding model change.
[scc_index]
# Compact table: only the columns below, only the categories below, gzip-compressed CSV (a
# .gz path is decompressed on read). Rebuild it from the raw EPA download (kept in data/raw/,
# not committed) with: uv run python -m scripts.compact_scc_table
source_path = "data/epa_scc_to_epa_emission_sector.csv.gz"
persist_dir = ".cache/scc_index"
collection = "scc_point_active"
# Rows kept: `data category` in categories and `status` in statuses.
categories = ["Point"]
statuses = ["Active"]
# Results returned per query, and documents embedded per request while indexing.
top_k = 5
batch_size = 500

# Field -> column of the SCC table.
[scc_index.columns]
scc = "SCC"
category = "data category"
status = "status"
level_one = "scc level one"
level_two = "scc level two"
level_three = "scc level three"
level_four = "scc level four"
sector = "sector"

# Meteorology: one reporting year of hourly reanalysis from the Open-Meteo historical archive
# (no API key). Free tier terms: non-commercial use only, fewer than 10,000 calls a day, 5,000 an
# hour and 600 a minute, data under CC BY 4.0 (attribution required).
# `model` pins the reanalysis: "era5" is 0.25 degrees (about 25 km), hourly from 1940, published
# with about a 5-day delay; the API default ("best_match") mixes products, so it is not used.
# A year can be requested once its last day is `archive_lag_days` in the past.
[meteorology]
base_url = "https://archive-api.open-meteo.com"
archive_path = "/v1/archive"
model = "era5"
wind_speed_unit = "ms"
timezone = "UTC"
coordinate_decimals = 4
delay_seconds = 0.5
timeout_seconds = 60.0
max_retries = 2
backoff_seconds = 5.0
default_year = 2022
first_year = 1940
archive_lag_days = 7
# The annual mean wind speed is not reported below this (m/s). A choice kept from the original
# draft; AERSCREEN's own default minimum is 0.5 m/s.
minimum_wind_speed = 1.0
# Width of the wind direction sectors used for the prevailing direction (degrees; divides 360).
sector_width = 10.0

# Quantity -> archive variable name.
[meteorology.variables]
temperature = "temperature_2m"
wind_speed = "wind_speed_10m"
wind_direction = "wind_direction_10m"
solar_radiation = "shortwave_radiation"
cloud_cover = "cloud_cover"
low_cloud_cover = "cloud_cover_low"
is_day = "is_day"

# Quantity -> unit the archive must report (checked on every response); `temperature` is
# converted from it to K with Pint.
[meteorology.units]
temperature = "°C"
wind_speed = "m/s"
wind_direction = "°"
solar_radiation = "W/m²"
cloud_cover = "%"
low_cloud_cover = "%"
is_day = ""

# Returned, labelled "screening default", when no usable data are available. 293 K is the
# ambient temperature SCREEN3's user's guide says to use when it is not known; no EPA source was
# found for a single default wind speed, direction and class, so those are assumptions (neutral
# class D, a light wind, a westerly direction).
[meteorology.screening_default]
wind_speed = 2.5
wind_direction = 270.0
stability_class = "D"
ambient_temperature = 293.0

# Population around a point: Census tracts that intersect a circle (TIGERweb, no key), then ACS
# 5-year Data Profile counts per county (Census Data API). The Census Data API REQUIRES a free
# API key (https://api.census.gov/data/key_signup.html): without one it redirects every request to a
# "Missing Key" page. Put the key in .env as the variable named by `api_key_env_var`.
# TIGERweb layer 8 is "Census Tracts" (up to 100,000 records per query). A 50 km circle around New
# York City reaches 19 counties, so up to `max_counties` ACS requests are made per call.
[population]
tract_url = "https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_Current/MapServer/8/query"
acs_base_url = "https://api.census.gov"
# {year} is the ACS 5-year vintage below.
acs_path = "/data/{year}/acs/acs5/profile"
acs_year = 2023
api_key_env_var = "CENSUS_API_KEY"  # pragma: allowlist secret
# Search radius (km): the default is one mile; requests outside [min, max] are refused.
default_radius_km = 1.609
min_radius_km = 0.1
max_radius_km = 50.0
max_counties = 25
delay_seconds = 0.2
timeout_seconds = 60.0
max_retries = 2
backoff_seconds = 5.0

# Meaning -> TIGERweb tract field.
[population.fields]
state = "STATE"
county = "COUNTY"
tract = "TRACT"
land_area = "AREALAND"

# Meaning -> ACS DP05 variable (labels checked for the 2023 vintage: total population, under 5
# years, under 18 years, 65 years and over).
[population.variables]
total = "DP05_0001E"
under_5 = "DP05_0005E"
under_18 = "DP05_0019E"
over_65 = "DP05_0024E"

# Returned, labelled "screening default", when no census data can be used. The age mix is the
# United States row of the ACS 2023 5-year profile (5.7, 16.5, 61.0, 16.8 percent). The density
# has no source: it is a suburban-scale assumption (the US average is about 36 people per km2,
# dense cities exceed 1,000).
[population.screening_default]
residents_per_km2 = 300.0

[population.screening_default.age_distribution]
"0-4" = 5.7
"5-17" = 16.5
"18-64" = 61.0
"65+" = 16.8

# Exposure metrics: EPA SCREEN3-style screening (EPA-454/B-95-004 SCREEN3 User's Guide, section 3,
# and EPA-454/R-92-019 Screening Procedures, sections 3 and 4.2). Flat terrain, rural dispersion,
# receptor at `receptor_height_m` above ground. The worst case is the maximum over every
# (stability class, 10 m wind speed) combination below and every distance of the array.
[exposure]
receptor_height_m = 0.0
# 1-hour maximum -> annual average (Screening Procedures, section 4.2 step 5; 3 h 0.9, 8 h 0.7,
# 24 h 0.4, annual 0.08).
annual_average_factor = 0.08
# SCREEN3 automated distance array, truncated at 10 km because the project's Briggs rural
# dispersion coefficients (models/transport/dispersion.py) are valid for 100 m to 10 km (EPA's array
# continues in 5 km and 10 km steps to 50 km). Distances in meters; `end` is inclusive.
min_distance_m = 100.0
distance_segments = [
    { start = 100.0, end = 3000.0, step = 100.0 },
    { start = 3500.0, end = 10000.0, step = 500.0 },
]

# SCREEN3 "full meteorology": 10 m wind speeds (m/s) per stability class (SCREEN3 User's Guide,
# Table 2; 54 combinations).
[exposure.wind_speeds]
A = [1.0, 1.5, 2.0, 2.5, 3.0]
B = [1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]
C = [1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 8.0, 10.0]
D = [1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 8.0, 10.0, 15.0, 20.0]
E = [1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]
F = [1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0]

# Wind profile power-law exponent, rural (Screening Procedures, Table 3-1); no adjustment below 10 m.
[exposure.wind_exponent]
A = 0.07
B = 0.07
C = 0.10
D = 0.15
E = 0.35
F = 0.55

# Potential temperature gradient (K/m) for the stable plume rise (Screening Procedures, equation
# 4.6 and section 4.4: 0.02 for E, 0.035 for F).
[exposure.potential_temperature_gradient]
E = 0.02
F = 0.035

# Resident-air exposure factors (EPA RSL User's Guide, section 6, Table 1): exposure time (h/day),
# exposure frequency (days/yr), exposure duration (yr; 6 child + 20 adult) and lifetime (yr) for
# the carcinogenic averaging time.
[exposure.factors]
exposure_time_hours_per_day = 24.0
exposure_frequency_days_per_year = 350.0
exposure_duration_years = 26.0
lifetime_years = 70.0

# Per age band of the population tool: mean long-term inhalation rate (m3/day, EPA Exposure
# Factors Handbook 2011, Table 6-1) and mean body weight (kg, Table 8-1) of ONE handbook age
# group inside the band: the group with the highest inhalation rate per kilogram, the conservative
# choice for a screening dose. 0-4 -> "1 to <2 years"; 5-17 -> "3 to <6 years" (holds age 5);
# 18-64 -> "16 to <21 years" (holds 18 to 20); 65+ -> "61 to <71 years" (adult weight).
[exposure.age_bands."0-4"]
inhalation_rate_m3_per_day = 8.0
body_weight_kg = 11.4

[exposure.age_bands."5-17"]
inhalation_rate_m3_per_day = 10.1
body_weight_kg = 18.6

[exposure.age_bands."18-64"]
inhalation_rate_m3_per_day = 16.3
body_weight_kg = 71.6

[exposure.age_bands."65+"]
inhalation_rate_m3_per_day = 14.2
body_weight_kg = 80.0

# Facility industry: the primary NAICS code of ONE TRI submission (the one an emission record
# reports, identified by its control number `doc_ctrl_num`) and the title of that code, both from
# Envirofacts (shared base URL and request policy in [efservice]). The first query reads the
# submission's primary NAICS row (`primary_ind` = 1: exactly one per submission); the second reads
# the title from REF_NAICS. The title, not the code, is what the SCC process search needs.
# The row's `source` says who gave the code: "Reported" (the facility, from reporting year 2006) or
# "ASSIGNED" (EPA, by crosswalk or from commercial data; often generic). `placeholder_codes` are
# codes that are not industries (999999 is "AFS Migration").
[industry]
submission_naics_path = "/tri_submission_naics/primary_ind/1/doc_ctrl_num/{doc_ctrl_num}/JSON"
title_path = "/REF_NAICS/NAICS_CODE/{naics_code}/JSON"
code_field = "naics_code"
primary_field = "primary_ind"
primary_value = "1"
sequence_field = "naics_sequence_num"
origin_field = "source"
reported_value = "Reported"
assigned_value = "ASSIGNED"
title_field = "naics_desc"
placeholder_codes = ["999999"]
# Titles of six-digit codes from the Census Bureau's NAICS code lists (2017 and 2022 vintages,
# newest title first), built from the workbooks in data/raw/naics (not committed) with:
# uv run python -m scripts.build_naics_titles
# The table is the first source of a title: every facility of the inventory carries its industry
# in words without a request, and REF_NAICS is asked only for a code the lists do not have.
titles_path = "data/naics_titles.csv"
titles_code_column = "naics_code"
titles_title_column = "naics_title"

# Batch facility assessment (tools/assessment/): the whole chain (stacks, weather, residents,
# exposure) for every listed facility in code, so no facility depends on the model repeating
# a dozen calls. Stacks: the facility's NEI stacks; else the PSTK stacks of the SCCs that match
# its industry title with a similarity of at least `scc_min_score` (0.55 keeps e.g. "Soybean
# and Other Oilseed Processing" -> soybean oil SCCs at ~0.69 and drops "Railroad Rolling Stock
# Manufacturing" -> "Stamping" at 0.47), up to `max_scc_stacks` distinct ones evaluated as a
# range; else the EPA AirToxScreen global default. `max_facilities` matches [tri].max_listed.
# `max_workers` facilities run at once (each makes a few requests to Open-Meteo and Census).
[assessment]
# Full chain (site weather, residents, representative case) for at most this many facilities,
# highest own-stack worst-case risk first. One year of hourly ERA5 weather costs ~26 Open-Meteo
# calls (7 variables, 365 days); the free tier allows 600 a minute and 5000 an hour.
max_facilities = 25
# Own stacks and worst case (no weather or Census request) for at most this many facilities
# whose bound reaches a screening threshold, largest bound first.
max_refined = 500
max_workers = 4
scc_min_score = 0.55
max_scc_stacks = 3
inventory_cache_seconds = 900
max_worst_case_listed = 100
# Screened-out facilities listed to the model, closest to a threshold first.
max_screened_out_listed = 5
# ERA5 is a 0.25-degree grid: facilities in one cell get the same series, so they share a request.
weather_cell_deg = 0.25

# Tiered screening (EPA's tiered approach: exclude only on a conservative bound). The bound is
# the worst case with the AirToxScreen global default stack (3 m, cold, slow) over the SCREEN3
# weather combinations and these ambient temperatures, with a person at the maximum. A facility
# is assessed further when its bound reaches either threshold: HQ 0.1 leaves room for other
# chemicals at the same site; 1e-6 is the lower end of EPA's acceptable cancer-risk range.
[assessment.screening]
hq = 0.1
cancer_risk = 1e-6
ambient_temperatures_k = [253.15, 273.15, 293.15, 313.15]

# Read-across (tools/informatics/read_across.py): the closest TRI chemical to a query chemical,
# scored as alpha * MolDeBERTa cosine + (1 - alpha) * ECFP4 Tanimoto. A match is within the
# applicability domain when its hybrid score is at least `min_hybrid_score`. The catalog is
# built (and refreshed from the current TRI list) with:
#   uv run python -m scripts.build_tri_embeddings
#
# The cosine is taken after subtracting the catalog's mean embedding (a first-order isotropy
# correction, applied when the catalog is loaded): the model's raw vectors sit in a narrow cone,
# where isohexane scored an alcohol above n-hexane and 94.7% of chemicals had a neighbour above
# 0.60. A score is therefore relative to the catalog it was computed against, and comparable
# only within one catalog version.
#
# Vectors are stored as float32 and bits as int8, zstd-compressed: float64 vectors and int64
# bits made one 3.6 MB file, over the repository's 1000 KB limit.
#
# `min_hybrid_score` is calibrated against the catalog's own leave-one-out nearest-neighbour
# distribution, not guessed. For the 712-chemical catalog of October 2026: p33 = 0.597,
# p34 = 0.601, median 0.687, so 0.60 rejects the weakest third (in-domain share 66%); caffeine,
# which has no TRI analogue, scores 0.379. Recalibrate with
# `models.chemistry.similarity.leave_one_out_scores` when the catalog or the model changes.
[read_across]
# The catalog is sharded by the leading digit(s) of the CAS number, like data/nei_stacks, so
# every committed file stays small and a rebuild rewrites only the shards that changed (the
# pinned model re-embeds a given SMILES to the identical bytes). Scoring reads every shard.
directory = "data/tri_chemicals"
file_template = "tri_chemicals_{prefix}.parquet"
prefix_digits = 1
alpha = 0.55
min_hybrid_score = 0.60

# PubChem PUG REST (no API key; at most 5 requests a second). PubChem now answers the
# CanonicalSMILES and IsomericSMILES names as ConnectivitySMILES and SMILES, so the SMILES is
# read from the first of `smiles_properties` present. `{cas}` is the CAS number.
[read_across.pubchem]
url_template = "https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/{cas}/property/CanonicalSMILES,IsomericSMILES,MolecularWeight/JSON"
smiles_properties = ["CanonicalSMILES", "IsomericSMILES", "SMILES", "ConnectivitySMILES"]
weight_property = "MolecularWeight"
delay_seconds = 0.25
timeout_seconds = 20.0
max_retries = 2
backoff_seconds = 2.0

# The SMILES encoder (Hugging Face; about 500 MB, downloaded on first use and cached by
# Hugging Face). Licence CC BY-NC-ND 4.0: non-commercial use only. `revision` pins the exact
# model commit so the committed catalog and new queries always come from the same weights.
[read_across.model]
name = "SaeedLab/MolDeBERTa-base-123M-mtr"
revision = "7d06a5f39098837a6f33ed095e2fa7706e30f8b9"  # pragma: allowlist secret (public git sha)
max_length = 128
embedding_width = 768

# Morgan (ECFP4) fingerprint: radius 2, folded to `n_bits` bits.
[read_across.fingerprint]
radius = 2
n_bits = 1024

# Field -> column of the catalog. `benchmark_flag` and `naics_prefixes` are optional columns
# (the read-across filters use them only when the catalog has them).
[read_across.columns]
cas = "tri_cas"
name = "chemical_name"
smiles = "canonical_smiles"
molecular_weight = "molecular_weight"
embedding = "moldeberta_vec"
bits = "morgan_bits"
benchmark_flag = "has_iris_benchmark"
naics_prefixes = "naics_prefixes"

# The current TRI chemical list (Envirofacts `tri_chem_info`; base URL and request policy from
# [efservice]), read by the catalog builder. Rows whose CAS field is not a CAS number are TRI
# groups or placeholders (N420, MIXTURE, TRD SECRT, ...) and are skipped; so are chemicals
# delisted from TRI (`inactive_field` other than `active_value`) unless `keep_delisted`.
[read_across.tri_list]
path = "/tri_chem_info/rows/{start}:{end}/JSON"
page_size = 2000
cas_field = "cas_registry_number"
name_field = "chem_name"
inactive_field = "inactive_date"
active_value = "9999"
keep_delisted = false

# Source unit spellings that Pint cannot parse, mapped to ones it can. Applied to reported
# units and to target units before conversion; add a line when a new spelling shows up.
[units.aliases]
"mg/m3" = "mg/m^3"
"ug/m3" = "ug/m^3"
"mg/kg-day" = "mg/(kg*day)"
"(mg/kg-day)-1" = "1/(mg/(kg*day))"
"(ug/m3)-1" = "1/(ug/m^3)"
"(mg/m3)-1" = "1/(mg/m^3)"
"(mg/L)-1" = "1/(mg/L)"
"Pounds" = "pound"

# The chat model that drives the agent, used by the program (`uv run python -m app`) and by the
# evaluations alike, so both always run the same model. `provider` selects the factory in
# app/chat_model.py; the API key is read from the environment variable named here.
# `recursion_limit` is the LangGraph step limit of one run.
# `temperature` 0 makes the agent as reproducible as the provider allows: a screening
# assessment should give the same reasoning for the same inputs, and sampling at the provider
# default (1.0 for OpenAI) only adds run-to-run variation. Range 0 to 2.
[agent]
provider = "openai"
model = "gpt-4.1"
api_key_env_var = "OPENAI_API_KEY"  # pragma: allowlist secret
timeout_seconds = 120.0
recursion_limit = 80
temperature = 0.0

# Agent evaluation (evals/). The agent model comes from [agent]; the judge is a different,
# stronger model that scores report wording, pinned so runs are repeatable. Network tools are
# replayed from recordings in `cassette_dir`; the tools in `live_tools` need no network and run
# for real.
[evaluation]
judge_provider = "openai"
judge_model = "gpt-5.5-2026-04-23"
judge_api_key_env_var = "OPENAI_API_KEY"  # pragma: allowlist secret
live_tools = ["calculate_exposure_metrics"]
cassette_dir = "evals/cassettes"
report_dir = "evals/reports"

# Local web interface (api/ + frontend/). The backend binds only to a loopback host and
# serves the built frontend from `frontend_dist` (`npm --prefix frontend run build`).
# `max_key_length` bounds the API key accepted by the settings sheet (characters).
[ui]
host = "127.0.0.1"
port = 8000
frontend_dist = "frontend/dist"
max_key_length = 512

# OS credential store entries holding the API keys (macOS Keychain, Secret Service, Windows
# Credential Locker): one service name and one account per key. Names only; a key itself never
# appears in this file.
[ui.keyring]
service = "epa-chemical-risk-agent"

[ui.keyring.accounts]
openai = "openai_api_key"
census = "census_api_key"
comptox = "comptox_api_key"

# Guardrail prompts (prompts/<name>.md). The scope classifier sees `history_window` earlier
# messages besides the latest user message, so follow-ups are judged in context. The completion
# check reviews the agent's reply and sends it back to work with the nudge when it only announced
# what it would do next, at most `max_nudges` times per user turn (0 turns the check off).
[ui.prompts]
scope_classifier = "scope_classifier"
scope_addendum = "scope_addendum"
scope_fallback = "scope_redirect_fallback"
history_window = 6
completion_classifier = "completion_check"
completion_nudge = "completion_nudge"
max_nudges = 2

# Human-readable step label shown for each tool call, keyed by tool name.
[ui.step_labels]
fetch_chemical_properties = "Looked up chemical properties (CompTox)"
find_tri_read_across_surrogate = "Resolved read-across surrogate (MolDeBERTa + ECFP4)"
query_emissions_inventory = "Queried EPA TRI releases"
fetch_facility_industry = "Identified facility industry (NAICS)"
lookup_scc_process_description = "Matched process to SCC"
fetch_stack_parameters_from_nei = "Queried NEI stack parameters"
fetch_stack_parameters_from_scc = "Looked up PSTK stack parameters"
get_meteorological_boundary = "Retrieved meteorology"
get_population_receptors = "Counted Census receptors"
calculate_exposure_metrics = "Computed screening dispersion and risk"
assess_facilities = "Screened every facility and assessed those that may matter"

# Basemap vector styles (CARTO Positron / Dark Matter), the half-angle of the schematic
# downwind sector drawn on the map (degrees; a drawing choice, not a modelled plume width),
# the angular spacing of the vertices of the drawn circle and sector arc (degrees; smaller
# is smoother),
# marker radii (px) for the smallest and largest emission rate on screen (square-root scale),
# and the tolerance (decimal degrees) when matching a receptor query to a facility's
# coordinates (the agent passes the inventory's coordinates through unchanged).
[ui.map]
light_style = "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json"
dark_style = "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json"
sector_half_angle_deg = 22.5
vertex_spacing_deg = 5.0
marker_min_px = 6.0
marker_max_px = 22.0
coordinate_tolerance_deg = 0.000001

# What the map shows before any facility is placed: the contiguous United States (TRI covers US
# facilities), as a box in decimal degrees (WGS84, west negative).
[ui.map.initial_view]
west = -125.0
south = 24.5
east = -66.9
north = 49.5

# Status thresholds for the summary ribbon and markers.
# HQ: `hq_concern` 1.0 is EPA's non-cancer threshold of concern (exposure equals the RfC);
# `hq_near_lower` is a display choice for the amber "near" band, not a regulatory value.
# Cancer risk: EPA's acceptable lifetime-risk range is 1e-6 to 1e-4; below it is "below",
# inside it "near", above it "above".
[ui.thresholds]
hq_concern = 1.0
hq_near_lower = 0.5
cancer_lower = 1e-6
cancer_upper = 1e-4

# Display: significant digits for metrics, the viewport width (px) below which the two panes
# stack, and the onboarding suggestion chips.
[ui.display]
significant_digits = 3
narrow_breakpoint_px = 900
suggestions = [
    "Map hexane (CAS 110-54-3) releases and compute exposure metrics",
    "Find a TRI read-across surrogate for isohexane (107-83-5)",
    "Assess benzene (CAS 71-43-2) releases from the largest emitting facility",
    "How does the screening dispersion model pick the worst case?",
]

# Workspace layout. The rail is an icon strip (`rail_collapsed_px`) or expanded between
# `rail_min_px` and `rail_max_px`, in px. The chat dock opens at `chat_default_share` of the
# viewport width, never below `chat_min_px` (px) or above `chat_max_share` of it. The overview
# panel takes `overview_default_share` of the analysis area height, between the min and max
# shares. These are display choices, not regulatory values.
[ui.layout]
rail_collapsed_px = 60
rail_default_px = 240
rail_min_px = 200
rail_max_px = 320
chat_default_share = 0.34
chat_min_px = 280
chat_max_share = 0.55
overview_default_share = 0.4
overview_min_share = 0.15
overview_max_share = 0.75

# Conversation threads kept in server memory (never on disk). Past this many, the least
# recently used idle thread is forgotten. A memory bound, not a limit on useful history.
[ui.threads]
max_retained = 20

# Token prices per chat model, USD per million tokens, with the date and page they were taken
# from. A model without an entry is shown as "unpriced"; never fill these from memory.
[ui.pricing]

# "Standard pricing data" table (not batch, not fast/priority): Input, Output, Cached input.
# The model page https://platform.openai.com/docs/models/gpt-4.1 lists the same three prices.
[ui.pricing."gpt-4.1"]
input_usd_per_mtok = 2.00
cached_input_usd_per_mtok = 0.50
output_usd_per_mtok = 8.00
priced_on = 2026-10-20
source_url = "https://platform.openai.com/docs/pricing"

# Census Bureau Quarterly Survey of Plant Capacity Utilization (QPC): the developer script
# scripts/build_census_qpc_baseline.py downloads one quarterly workbook and writes the average
# plant hours per week by four-digit NAICS code to `output_path`. Run it with:
# uv run python -m scripts.build_census_qpc_baseline
[qpc]
# Workbook of a release; {year} is four digits, {quarter} is 1-4. Only https on `allowed_host`.
url_template = "https://www2.census.gov/programs-surveys/qpc/tables/{year}/{year}-qtr-table-final-q{quarter}.xlsx"
allowed_host = "www2.census.gov"
# A release is published about 2.5 months after its quarter ends, so the newest quarter is not
# there yet: use the one this many quarters before the current one (2026 Q4 -> 2026 Q2).
lag_quarters = 2
# The tab, the header labels (whitespace and case ignored) and the title cell (A1) to look for.
sheet_name = "FULL Utilization Rates"
code_header = "NAICS Code(s)"
hours_header = "Average plant hours per week in operation"
# Named groups `year` and `quarter` of the sheet title, e.g. "... Full Rates: 2026 Quarter 2".
title_pattern = "(?P<year>\\d{4}) Quarter (?P<quarter>[1-4])"
# The workbook must state this NAICS edition; the pattern's group `edition` is searched for in
# `intro_sheet_name`. The four-digit codes of another edition are not comparable.
intro_sheet_name = "Introduction"
naics_edition = 2022
# Column of the NAICS titles table ([industry].titles_path) that says which edition a code is from;
# the four-digit children of a three-digit row are the codes of `naics_edition` under it.
titles_vintage_column = "vintage"
naics_edition_pattern = "(?P<edition>\\d{4}) edition of the North American Industry Classification"
# Plausible hours per week: more than `min_hours` (exclusive) and at most `max_hours_per_week`
# (24 h x 7 d = 168, continuous operation, is valid).
min_hours = 0
max_hours_per_week = 168
# Fewer four-digit codes than this means the layout changed; the file is not written.
min_codes = 50
# How many rows from the top the header row may be.
header_search_rows = 15
timeout_seconds = 30
max_bytes = 5_000_000
output_path = "data/census_qpc_baseline.parquet"

# Operating hours by industry (tools/emissions/helpers/inventory/plant_hours.py): a facility's
# primary NAICS code is matched, most specific first (its own length down to `min_digits`),
# against the Census QPC baseline built by scripts/build_census_qpc_baseline.py; the matched
# average plant hours per week become operating hours per year as h/week x days_per_year / 7
# (168 h/week = 8760 h/yr). No match: [emissions].operating_hours_per_year.
[plant_hours]
baseline_path = "data/census_qpc_baseline.parquet"
code_column = "naics_code"
hours_column = "avg_plant_hours_per_week"
min_digits = 3
max_digits = 6
days_per_year = 365
# Rows above this many hours per week (hours in a week) are not plausible and are ignored.
max_hours_per_week = 168
