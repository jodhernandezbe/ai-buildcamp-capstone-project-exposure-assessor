default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]
        stages: [manual]  # opt in with: pre-commit run --hook-stage manual

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.0
    hooks:
      - id: uv-lock

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^uv\.lock$

  # Project-environment hooks: run with the versions pinned in uv.lock.
  - repo: local
    hooks:
      - id: function-length
        name: function length (max 18 body lines)
        entry: uv run python scripts/check_function_length.py --max 18
        language: system
        types: [python]
        files: ^(agent|app|commons|config|evals|models|prompts|tools)/
      - id: pyright
        name: pyright (strict)
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit (security lint)
        entry: uv run bandit -c pyproject.toml -r agent app commons config evals models prompts tools
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
