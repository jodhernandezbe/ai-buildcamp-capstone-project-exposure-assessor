[project]
name = "exposure-assessor"
version = "0.1.0"
description = "Screening-level chemical exposure risk assessments from unified TRI data and transport models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "evidently>=0.7.23,<0.8",
    "fastapi>=0.156.4",
    "httpx>=0.28.1",
    "jupyter>=1.0.0",
    "keyring>=25.7.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=1.7.0",
    "langgraph>=0.2.0",
    "logfire>=5.4.0",
    "minsearch>=0.0.5",
    "numpy>=2.0.0",
    "openai>=1.50.0",
    "pint>=0.26.1",
    "pyarrow>=26.0.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.0",
    "rdkit>=2026.9.1",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.7.0",
    "detect-secrets>=1.5.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
    "pyright>=1.1.380",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "FA", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN401"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = '-m "not smoke and not eval"'
markers = [
    "smoke: live-network checks against real services (run with: pytest -m smoke)",
    "comptox: smoke test that needs the CompTox API key (skipped when it is not set)",
    "census: smoke test that needs the Census API key (skipped when it is not set)",
    "logfire: smoke test that needs the Logfire read token (skipped when it is not set)",
    "eval: agent evaluation with a real chat model (run with: pytest -m eval)",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["agent", "app", "api", "commons", "config", "evals", "models", "prompts", "scripts", "tools", "tests"]
venvPath = "."
venv = ".venv"
# langgraph ships partial typing; keep strict for our code, tolerate its gaps.
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
